<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>六上國語期中考檢討</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bpmf+Zihi+Kai+Std&display=swap">
<style>
/* Layout: one exam section per screen, like a single sheet of 作業簿; blue pen = student, red pen = grading */
:root {
  --page: #EEF2F6;
  --sheet: #FFFFFF;
  --ink: #1E2A3A;
  --muted: #5B6878;
  --line: #D5DCE5;
  --grid: #E6ECF3;
  --blue: #2350A8;
  --blue-soft: #E5ECF9;
  --red: #C2362B;
  --red-soft: #FBE9E6;
  --green: #1D7548;
  --green-soft: #E3F2E9;
  --zy: "Bpmf Zihi Kai Std", "BiauKai", "DFKai-SB", "Kaiti TC", "STKaiti", serif;
  --kai: "BiauKai", "DFKai-SB", "Kaiti TC", "STKaiti", "PingFang TC", "Microsoft JhengHei", serif;
  --ui: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #11161D; --sheet: #1A222C; --ink: #E5EAF0; --muted: #9AA6B5; --line: #2D3946; --grid: #212B36;
  --blue: #86A8F2; --blue-soft: #1C2943; --red: #F2867B; --red-soft: #3A1E1B; --green: #66C895; --green-soft: #163223;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #11161D; --sheet: #1A222C; --ink: #E5EAF0; --muted: #9AA6B5; --line: #2D3946; --grid: #212B36;
  --blue: #86A8F2; --blue-soft: #1C2943; --red: #F2867B; --red-soft: #3A1E1B; --green: #66C895; --green-soft: #163223;
  color-scheme: dark }
html.nozy { --zy: var(--kai); }

* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px;
  -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
.wrap { max-width: 760px; margin: 0 auto; }
.zy { font-family: var(--zy); }
.plain { font-family: var(--ui); }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page); padding-block: 12px 10px; border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-size: 14px; color: var(--muted); letter-spacing: .04em; min-width: 0; }
.brand b { color: var(--ink); font-size: 16px; letter-spacing: 0; }
.zytoggle { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 6px 12px; font-size: 14px; white-space: nowrap; }
.zytoggle[aria-pressed="true"] { border-color: var(--blue); color: var(--blue); }
.steps { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }
.step { flex: 1 0 auto; min-width: 34px; text-align: center; font-size: 14px; padding: 4px 6px; border-radius: 8px; background: var(--sheet); border: 1px solid var(--line); color: var(--muted); }
.step.done { background: var(--green-soft); border-color: transparent; color: var(--green); }
.step.now { background: var(--blue); border-color: var(--blue); color: var(--sheet); font-weight: 700; }

/* section */
.sec-head { padding-block: 22px 14px; display: grid; gap: 4px; }
.sec-tag { font-size: 14px; color: var(--blue); font-weight: 700; letter-spacing: .1em; }
.sec-head h1 { margin: 0; font-size: 30px; line-height: 1.4; text-wrap: balance; }
.sec-head .meta { margin: 0; color: var(--muted); font-size: 15px; }

.btn { border-radius: 14px; min-height: 54px; padding: 8px 18px; border: 2px solid transparent; font-size: 19px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: var(--blue); color: var(--sheet); }
.btn-primary:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.btn-ghost { background: var(--sheet); border-color: var(--line); }
.btn-good { background: var(--green-soft); color: var(--green); border-color: var(--green); width: 100%; }
.btn-good:active { transform: translateY(1px); }

.items { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 14px; }
.item { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.item.is-right { border-color: color-mix(in srgb, var(--green) 45%, var(--line)); }
.item.is-wrong { border-color: color-mix(in srgb, var(--red) 55%, var(--line)); }
.qrow { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
.num { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 18px; background: var(--blue-soft); color: var(--blue); font-variant-numeric: tabular-nums; }
.is-right .num { background: var(--green); color: var(--sheet); }
.is-wrong .num { background: transparent; color: var(--red); border: 3px solid var(--red); }
.q { font-size: 23px; line-height: 2; min-width: 0; overflow-wrap: anywhere; }
.key { background: var(--blue-soft); color: var(--blue); border-radius: 6px; padding: 0 .18em; font-weight: 700; }
.key.plain { font-size: .9em; letter-spacing: .05em; }
.choices { list-style: none; margin: 0; padding: 0 0 0 52px; display: grid; gap: 4px; font-size: 21px; line-height: 1.9; }
.choices li { display: grid; grid-template-columns: 1.6em 1fr; }
.choices .cn { font-family: var(--ui); color: var(--muted); }
.group { background: var(--blue-soft); border-radius: 12px; padding: 12px 16px; font-size: 20px; line-height: 1.9; display: grid; gap: 2px; }
.group-title { font-family: var(--ui); font-size: 14px; color: var(--blue); font-weight: 700; letter-spacing: .08em; }

.mark { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mbtn { min-height: 56px; border-radius: 14px; font-size: 20px; font-weight: 700; background: var(--sheet); border: 2px solid var(--line); }
.mbtn.r { color: var(--green); border-color: var(--green); }
.mbtn.w { color: var(--red); border-color: var(--red); }
.mbtn.r[aria-pressed="true"] { background: var(--green); color: var(--sheet); }
.mbtn.w[aria-pressed="true"] { background: var(--red); color: var(--sheet); }

.answer { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--green-soft); }
.answer .lbl { font-size: 14px; color: var(--green); font-weight: 700; letter-spacing: .08em; }
.answer b { font-size: 24px; color: var(--green); }
.exp { border-radius: 12px; border: 1px dashed var(--line); }
.exp summary { list-style: none; padding: 10px 14px; font-size: 19px; color: var(--blue); font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.exp summary::-webkit-details-marker { display: none; }
.exp summary::before { content: "▸"; transition: transform .2s; }
.exp[open] summary::before { transform: rotate(90deg); }
.exp p { margin: 0; padding: 0 16px 14px; font-size: 21px; line-height: 2; }
.is-wrong .exp { border-color: var(--red); background: var(--red-soft); }

.foot { margin-top: 20px; display: grid; gap: 10px; justify-items: center; text-align: center; }
.foot .btn { width: 100%; }
.hint { color: var(--muted); font-size: 16px; margin: 0; }
.hint.warn { color: var(--red); font-weight: 700; }

/* adult gate */
.gate { margin-top: 28px; background: var(--sheet); border-radius: 20px; border: 2px solid var(--red); padding: 28px 22px; display: grid; gap: 18px; text-align: center;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 28px 28px; }
.gate h2 { margin: 0; font-size: 32px; color: var(--red); text-wrap: balance; }
.gate .sum { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: left; font-size: 16px; display: grid; gap: 6px; }
.gate .sum strong { font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 2px 10px; border-radius: 999px; font-size: 14px; background: var(--red-soft); color: var(--red); font-weight: 700; }
.chip.ok { background: var(--green-soft); color: var(--green); }
.hold { position: relative; overflow: hidden; width: 100%; min-height: 64px; border-radius: 16px; border: 2px solid var(--blue); background: var(--sheet); color: var(--blue); font-size: 18px; font-weight: 700;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; --p: 0; }
.hold::before { content: ""; position: absolute; inset: 0; background: var(--blue-soft); transform: scaleX(var(--p)); transform-origin: left; }
.hold span { position: relative; }
.hold.small { min-height: 44px; font-size: 14px; border-width: 1px; color: var(--muted); border-color: var(--line); }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 15px; padding: 6px; }

/* quiz */
.opts { display: grid; gap: 8px; }
.opt { text-align: left; min-height: 54px; padding: 8px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--sheet); font-size: 21px; line-height: 1.8; display: flex; gap: 10px; align-items: center; }
.opt::before { content: ""; flex: 0 0 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); }
.opt[aria-checked="true"] { border-color: var(--blue); background: var(--blue-soft); }
.opt[aria-checked="true"]::before { border-color: var(--blue); background: var(--blue); box-shadow: inset 0 0 0 4px var(--blue-soft); }
.opt.ok { border-color: var(--green); background: var(--green-soft); }
.opt.ok::before { border-color: var(--green); background: var(--green); }
.opt.bad { border-color: var(--red); background: var(--red-soft); }
.opt.bad::before { border-color: var(--red); background: var(--red); }
.opt:disabled { cursor: default; color: var(--ink); }
.src { font-size: 14px; color: var(--muted); }
.ask { font-size: 19px; color: var(--blue); margin: 0; }
.score { margin-top: 18px; padding: 18px; border-radius: 16px; background: var(--sheet); border: 1px solid var(--line); display: grid; gap: 4px; text-align: center; }
.score .big { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
.verdict { font-weight: 800; font-size: 20px; }
.verdict.ok { color: var(--green); }
.verdict.bad { color: var(--red); }

.celebrate { margin-top: 28px; background: var(--sheet); border-radius: 20px; border: 2px solid var(--green); padding: 30px 22px; text-align: center; display: grid; gap: 14px; }
.celebrate h2 { margin: 0; font-size: 34px; color: var(--green); }
.stamp { margin: 0 auto; width: 110px; height: 110px; border-radius: 50%; border: 5px double var(--red); color: var(--red); display: grid; place-items: center; font-size: 26px; font-weight: 800; transform: rotate(-12deg); font-family: var(--kai); }
.pagefoot { margin-top: 36px; display: grid; justify-items: center; }
.pagefoot .hold { max-width: 320px; }

@media (max-width: 480px) {
  .q { font-size: 21px; } .choices { padding-left: 0; font-size: 19px; } .opt { font-size: 19px; }
  .sec-head h1 { font-size: 26px; } .qrow { grid-template-columns: 34px 1fr; } .num { width: 34px; height: 34px; font-size: 16px; }
  .mbtn { font-size: 18px; } .item { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand"><b>六上國語期中考</b>　第一～六課 檢討</div>
      <button class="zytoggle" id="zytoggle" aria-pressed="true">注音 開</button>
    </div>
    <nav class="steps" id="steps" aria-label="進度"></nav>
  </header>
  <main id="main"></main>
  <div class="pagefoot" id="pagefoot"></div>
</div>

<script>
const CN = ['①','②','③','④','⑤','⑥'];
const SECS = [
 { key:'一', title:'寫出國字', meta:'每題 1 分，共 5 分', items:[
  { q:'在時間內完成任務，我才能感到「[ㄊㄚˋ]」實。', ans:'踏（踏實）', exp:'「踏實」的「踏」是用腳踩的意思，所以是「足」字旁。腳穩穩踩在地上，心裡就很安穩，這種感覺叫做「踏實」。', opts:['踏','蹋','塔','榻'] },
  { q:'大自然的「[ㄠˋ]」妙正等著你去探索。', ans:'奧（奧妙）', exp:'「奧」是很深、不容易懂的意思，「奧妙」就是神奇又難懂的道理。不要寫成有水字旁的「澳」，那是海邊的港灣，像「澳洲」。', opts:['奧','澳','懊','傲'] },
  { q:'校園內「[ㄗㄞ]」種了許多不同種類的花。', ans:'栽（栽種）', exp:'「栽」是把植物種下去，所以字裡有「木」。下面是「火」的「災」是火災、災難，跟種花沒有關係。', opts:['栽','災','哉','載'] },
  { q:'表哥參加「[ㄅㄧㄢˋ]」論比賽得到第一名。', ans:'辯（辯論）', exp:'辯論是用「說話」來比道理，所以中間是「言」。中間是刀的「辨」是分辨，中間是絲的「辮」是辮子，中間是瓜的「瓣」是花瓣。', opts:['辯','辨','辮','瓣'] },
  { q:'里長誠「[ㄓˋ]」的邀請社區民眾參加聯誼活動。', ans:'摯（誠摯）', exp:'「摯」是真心、懇切的意思，下面是「手」。「誠摯」就是非常真誠。', opts:['摯','致','質','至'] },
 ]},
 { key:'二', title:'寫出注音', meta:'每題 1 分，共 5 分', items:[
  { q:'這家店的「[杏]」仁茶味道香醇濃郁。', ans:'ㄒㄧㄥˋ', exp:'「杏」唸ㄒㄧㄥˋ，第四聲。結尾是ㄥ（後鼻音），不是ㄣ喔！', opts:['ㄒㄧㄥˋ','ㄒㄧㄣˋ','ㄒㄧㄥˇ','ㄒㄧㄤˋ'] },
  { q:'遺失錢包的事讓他得到「[慘]」痛的教訓。', ans:'ㄘㄢˇ', exp:'「慘」唸ㄘㄢˇ，第三聲。聲母是ㄘ，不是ㄙ。「慘痛」就是非常痛苦。', opts:['ㄘㄢˇ','ㄘㄢˊ','ㄙㄢˇ','ㄘㄤˇ'] },
  { q:'小文模「[仿]」搞笑明星的功力真是一流。', ans:'ㄈㄤˇ', exp:'「仿」唸ㄈㄤˇ，第三聲，結尾是ㄤ。「模仿」就是學別人的樣子。', opts:['ㄈㄤˇ','ㄈㄤˊ','ㄈㄢˇ','ㄈㄤˋ'] },
  { q:'對手踏上舞臺前來道「[賀]」時，我依稀感覺自己眼眶泛淚。', ans:'ㄏㄜˋ', exp:'「賀」唸ㄏㄜˋ，第四聲。上面雖然有「加」，可是不唸ㄐㄧㄚ喔！「道賀」就是去恭喜別人。', opts:['ㄏㄜˋ','ㄏㄜˊ','ㄐㄧㄚˋ','ㄏㄨㄛˋ'] },
  { q:'警方收到消息，立即循線抓到歹「[徒]」。', ans:'ㄊㄨˊ', exp:'「徒」唸ㄊㄨˊ，第二聲。「歹徒」就是做壞事的壞人。', opts:['ㄊㄨˊ','ㄊㄨˇ','ㄉㄨˊ','ㄊㄡˊ'] },
 ]},
 { key:'三', title:'改錯字', meta:'每題 2 分，共 10 分', items:[
  { q:'你的人慈，讓周圍的人都感到溫暖與安慰。', qq:'你的{人慈}，讓周圍的人都感到溫暖與安慰。', ask:'畫線的語詞有錯字，正確的是哪一個？', ans:'人 → 仁（仁慈）', exp:'「仁慈」是心地善良、對人和氣。表示好心腸的是有「二」的「仁」，不是「人」。', opts:['仁慈','人辭','忍慈','仁詞'] },
  { q:'故事中，村民用計合力抓住凶很的山賊。', qq:'故事中，村民用計合力抓住{凶很}的山賊。', ask:'畫線的語詞有錯字，正確的是哪一個？', ans:'很 → 狠（凶狠）', exp:'「凶狠」是又凶又可怕。形容凶惡的「狠」是犬字旁，像野獸一樣凶；雙人旁的「很」只用在「很好、很多」。', opts:['凶狠','凶恨','凶痕','兇很'] },
  { q:'牆上的字跡已被損毀難以辮識。', qq:'牆上的字跡已被損毀難以{辮識}。', ask:'畫線的語詞有錯字，正確的是哪一個？', ans:'辮 → 辨（辨識）', exp:'「辨識」是分辨、認出來，中間是刀，好像用刀把東西分開來看。中間是絲的「辮」是辮子。', opts:['辨識','辯識','瓣識','辮式'] },
  { q:'這架飛機的機異故障了，沒辦法如期起飛。', qq:'這架飛機的{機異}故障了，沒辦法如期起飛。', ask:'畫線的語詞有錯字，正確的是哪一個？', ans:'異 → 翼（機翼）', exp:'「機翼」是飛機的翅膀。「翼」上面有「羽」，跟羽毛、翅膀有關；「異」是不一樣的意思。', opts:['機翼','機意','機藝','機義'] },
  { q:'阿姨這次懷孕懷了雙胞抬，全家人都很高興。', qq:'阿姨這次懷孕懷了{雙胞抬}，全家人都很高興。', ask:'畫線的語詞有錯字，正確的是哪一個？', ans:'抬 → 胎（雙胞胎）', exp:'雙胞胎跟身體、肚子裡的寶寶有關，所以是「月（肉）」字旁的「胎」。手字旁的「抬」是把東西舉起來。', opts:['雙胞胎','雙泡胎','雙抱胎','雙胞台'] },
 ]},
 { key:'四', title:'圈出正確的語詞', meta:'每題 1 分，共 4 分', items:[
  { q:'在衝突當下，有時候（沉醉／沉默）不見得是壞事，讓彼此有時間冷靜。', ans:'沉默', exp:'「沉默」是安靜不說話。吵架的時候先不說話，大家才有時間冷靜。「沉醉」是非常陶醉、著迷，放在這裡不合理。', opts:['沉默','沉醉'] },
  { q:'這家公司拍出許多有趣的（動畫／動聽）電影，深受大家的喜愛。', ans:'動畫', exp:'「動畫電影」就是卡通電影。「動聽」是聲音很好聽，用來說歌聲或音樂，不能拿來說電影。', opts:['動畫','動聽'] },
  { q:'這首曲子的旋律十分柔和動聽，（撫育／撫慰）了我們的心。', ans:'撫慰', exp:'「撫慰」是安慰，讓心情變好。「撫育」是照顧、養育孩子長大。好聽的音樂讓我們心情變好，所以選「撫慰」。', opts:['撫慰','撫育'] },
  { q:'這個角落擺滿了貨物，已經沒有（時空／空隙）再容納新的包裹了。', ans:'空隙', exp:'「空隙」是空出來的小地方。角落塞滿了，就是沒有空隙了。「時空」是時間和空間，用在這裡不通順。', opts:['空隙','時空'] },
 ]},
 { key:'五', title:'選出正確的字義', meta:'每題 3 分，共 18 分', items:[

  { q:'下面哪一個句子的意思前後矛盾不合理？', choices:['以前我不懂得問，現在想問卻找不到樹的蹤影','別人會對他這麼好，我相信他平時也常虧待他人','我喜歡看書，書中常有作者想傳達的道理','種過一棵樹，我們便有機會在樹下納涼'], ci:1, exp:'「虧待」是對別人不好。別人對他好，應該是因為他平常也「善待」別人；說他常常虧待別人，前後就不合理了。' },

// fill ids, answers for choice items
SECS.forEach((s, si) => s.items.forEach((it, ii) => {
  it.id = si + '-' + ii; it.si = si; it.n = ii + 1;
  if (it.choices) { it.ans = CN[it.ci] + ' ' + it.choices[it.ci]; it.opts = [it.choices[it.ci], ...it.choices.filter((_, k) => k !== it.ci)]; it.ask = it.ask || ''; }
}));
const ITEM = {}; SECS.forEach(s => s.items.forEach(it => ITEM[it.id] = it));

const KEY = 'mid6-guoyu-review-v1';
const fresh = () => ({ sec: 0, phase: 'review', marks: {}, open: {}, quiz: null, firstWrong: [], zy: true });
let st;
try { st = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || 'null') || {}); } catch (e) { st = fresh(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

const $ = s => document.querySelector(s);
const fmt = s => s.replace(/\[([^\]]+)\]/g, '<span class="key plain">$1</span>').replace(/\{([^}]+)\}/g, '<span class="key">$1</span>');

function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function order(n, seed) { const a = [...Array(n).keys()]; let x = seed || 1; for (let i = n - 1; i > 0; i--) { x = (Math.imul(x, 1103515245) + 12345) >>> 0; const j = x % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- top ---------- */
function renderSteps() {
  const nav = $('#steps'); let h = '';
  SECS.forEach((s, i) => {
    const cls = (st.phase === 'review' || st.phase === 'adult') && st.sec === i ? 'now' : (i < st.sec || st.phase === 'quiz' || st.phase === 'done') ? 'done' : '';
    h += `<span class="step ${cls}">${s.key}</span>`;
  });
  h += `<span class="step ${st.phase === 'quiz' ? 'now' : st.phase === 'done' ? 'done' : ''}">錯題</span>`;
  nav.innerHTML = h;
  const b = $('#zytoggle'); b.setAttribute('aria-pressed', st.zy); b.textContent = st.zy ? '注音 開' : '注音 關';
  document.documentElement.classList.toggle('nozy', !st.zy);
}

/* ---------- review ---------- */
function itemHTML(it) {
  const m = st.marks[it.id];
  const open = st.open[it.id] ?? (m === 'W');
  let h = `<li class="item ${m === 'R' ? 'is-right' : m === 'W' ? 'is-wrong' : ''}" id="it-${it.id}">`;
  if (it.head) h += `<div class="group zy"><span class="group-title">${it.head.t}</span>${it.head.l.map((x, k) => `<div>${it.head.bp ? '' : CN[k] + ' '}${x}</div>`).join('')}</div>`;
  h += `<div class="qrow"><span class="num">${m === 'R' ? '✓' : it.n}</span><div class="q zy">${fmt(it.q)}</div></div>`;
  if (it.choices) h += `<ol class="choices zy">${it.choices.map((c, k) => `<li><span class="cn">${CN[k]}</span><span>${c}</span></li>`).join('')}</ol>`;
  h += `<div class="mark"><button class="mbtn r zy" data-act="mark" data-id="${it.id}" data-v="R" aria-pressed="${m === 'R'}">我寫對了</button><button class="mbtn w zy" data-act="mark" data-id="${it.id}" data-v="W" aria-pressed="${m === 'W'}">我寫錯了</button></div>`;
  if (m) h += `<div class="answer"><span class="lbl">正確答案</span><b class="zy">${it.ans}</b></div>
    <details class="exp" data-id="${it.id}" ${open ? 'open' : ''}><summary class="zy">${m === 'W' ? '看看為什麼' : '看詳解'}</summary><p class="zy">${fmt(it.exp)}</p></details>`;
  return h + '</li>';
}
function footHTML() {
  const s = SECS[st.sec]; const left = s.items.filter(it => !st.marks[it.id]).length;
  return left ? `<p class="hint zy">還有 ${left} 題沒有按喔</p><button class="btn btn-primary zy" disabled>檢討好了</button>`
              : `<p class="hint zy">每一題都看過了嗎？</p><button class="btn btn-primary zy" data-act="finish">檢討好了</button>`;
}
function renderReview() {
  const s = SECS[st.sec];
  $('#main').innerHTML = `<section>
    <div class="sec-head"><span class="sec-tag">第${s.key}大題 ・ ${st.sec + 1} / 8</span><h1 class="zy">${s.title}</h1><p class="meta">${s.meta}</p></div>
    <button class="btn btn-good zy" data-act="allright">這一大題我全對 ✓</button>
    <ol class="items">${s.items.map(itemHTML).join('')}</ol>
    <div class="foot" id="foot">${footHTML()}</div></section>`;
}

/* ---------- adult gate ---------- */
function renderAdult() {
  const s = SECS[st.sec]; const wrong = s.items.filter(it => st.marks[it.id] === 'W');
  const last = st.sec === SECS.length - 1;
  $('#main').innerHTML = `<div class="gate">
    <h2 class="zy">請拿給大人批改</h2>
    <div class="sum"><strong>第${s.key}大題：${s.title}</strong>
      <div>孩子自評：寫對 ${s.items.length - wrong.length} 題，寫錯 ${wrong.length} 題</div>
      <div class="chips">${s.items.map(it => `<span class="chip ${st.marks[it.id] === 'R' ? 'ok' : ''}">第 ${it.n} 題 ${st.marks[it.id] === 'R' ? '對' : '錯'}</span>`).join('')}</div>
      <div style="color:var(--muted);font-size:14px">請對照考卷確認。若有出入，可以按下方「回去再看一下」讓孩子修改。</div>
    </div>
    <button class="hold" data-act="unlock"><span>大人按住 2 秒 → ${last ? '開始錯題測驗' : '開放第' + SECS[st.sec + 1].key + '大題'}</span></button>
    <button class="linkbtn" data-act="back">回去再看一下</button></div>`;
}

/* ---------- quiz ---------- */
function startQuiz(ids, round) { st.quiz = { round, ids, ans: {}, done: false }; st.phase = 'quiz'; }
function quizItemHTML(id, i) {
  const it = ITEM[id], q = st.quiz, sel = q.ans[id], ord = order(it.opts.length, hash(id) + q.round * 7919);
  const ok = q.done && sel === 0;
  let h = `<li class="item ${q.done ? (ok ? 'is-right' : 'is-wrong') : ''}">
    <div class="src">第${SECS[it.si].key}大題・${SECS[it.si].title}・第 ${it.n} 題</div>
    <div class="qrow"><span class="num">${q.done && ok ? '✓' : i + 1}</span><div class="q zy">${fmt(it.qq || it.q)}</div></div>`;
  if (it.ask) h += `<p class="ask zy">${it.ask}</p>`;
  else if (!it.choices) h += `<p class="ask zy">選出正確答案：</p>`;
  h += `<div class="opts" role="radiogroup">${ord.map(o => {
    let cls = '';
    if (q.done) { if (o === 0) cls = 'ok'; else if (o === sel) cls = 'bad'; }
    return `<button class="opt zy ${cls}" role="radio" aria-checked="${sel === o}" data-act="pick" data-id="${id}" data-o="${o}" ${q.done ? 'disabled' : ''}>${it.opts[o]}</button>`;
  }).join('')}</div>`;
  if (q.done) h += `<div class="verdict zy ${ok ? 'ok' : 'bad'}">${ok ? '答對了！' : '再想想，正確答案是：' + it.opts[0]}</div>
    <details class="exp" ${ok ? '' : 'open'}><summary class="zy">詳解</summary><p class="zy">${fmt(it.exp)}</p></details>`;
  return h + '</li>';
}
function renderQuiz(msg) {
  const q = st.quiz; const right = q.done ? q.ids.filter(id => q.ans[id] === 0).length : 0;
  let top = `<div class="sec-head"><span class="sec-tag">錯題小測驗 ・ 第 ${q.round} 回</span><h1 class="zy">${q.round === 1 ? '把寫錯的題目再做一次' : '再挑戰一次'}</h1><p class="meta">共 ${q.ids.length} 題，全部選好後按「交卷」</p></div>`;
  if (q.done) top += `<div class="score"><span class="zy">這一回答對</span><span class="big">${right} / ${q.ids.length}</span><span class="zy">${right === q.ids.length ? '全部答對，太厲害了！' : '錯的題目看完詳解，再做一次吧！'}</span></div>`;
  let foot;
  if (!q.done) foot = `${msg ? `<p class="hint warn zy">${msg}</p>` : ''}<button class="btn btn-primary zy" data-act="submit">交卷</button>`;
  else if (right < q.ids.length) foot = `<button class="btn btn-primary zy" data-act="retry">錯的再做一次</button>`;
  else foot = `<button class="btn btn-primary zy" data-act="complete">完成！</button>`;
  $('#main').innerHTML = `<section>${top}<ol class="items">${q.ids.map(quizItemHTML).join('')}</ol><div class="foot">${foot}</div></section>`;
}

/* ---------- done ---------- */
function renderDone() {
  const n = st.firstWrong.length;
  $('#main').innerHTML = `<div class="celebrate">
    <div class="stamp">優</div>
    <h2 class="zy">全部檢討完成！</h2>
    <p class="zy" style="font-size:20px;margin:0">${n ? `原本寫錯的 ${n} 題，現在都會了。` : '八大題全部都寫對，真棒！'}</p>
    ${n ? `<button class="btn btn-ghost zy" data-act="again">把原本的錯題再練一次</button>` : ''}
  </div>`;
}

function render(scroll) {
  renderSteps();
  ({ review: renderReview, adult: renderAdult, quiz: renderQuiz, done: renderDone })[st.phase]();
  $('#pagefoot').innerHTML = `<button class="hold small" data-act="reset"><span>大人按住 2 秒：從頭開始</span></button>`;
  if (scroll) window.scrollTo({ top: 0 });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.classList.contains('hold')) return;
  const act = b.dataset.act;
  if (act === 'mark') {
    st.marks[b.dataset.id] = b.dataset.v; delete st.open[b.dataset.id]; save();
    const el = document.getElementById('it-' + b.dataset.id);
    el.outerHTML = itemHTML(ITEM[b.dataset.id]); $('#foot').innerHTML = footHTML();
    const nb = document.querySelector(`#it-${b.dataset.id} [data-v="${b.dataset.v}"]`); nb && nb.focus({ preventScroll: true });
  } else if (act === 'allright') {
    SECS[st.sec].items.forEach(it => { st.marks[it.id] = 'R'; delete st.open[it.id]; }); save(); render();
    $('#foot').scrollIntoView({ behavior: 'smooth', block: 'center' });
  } else if (act === 'finish') { st.phase = 'adult'; save(); render(true); }
  else if (act === 'back') { st.phase = 'review'; save(); render(true); }
  else if (act === 'pick') { st.quiz.ans[b.dataset.id] = +b.dataset.o; save();
    b.parentElement.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-checked', o === b)); }
  else if (act === 'submit') {
    const miss = st.quiz.ids.filter(id => st.quiz.ans[id] === undefined);
    if (miss.length) { renderQuiz(`還有 ${miss.length} 題沒有選喔`); return; }
    st.quiz.done = true; save(); render(true);
  } else if (act === 'retry') { startQuiz(st.quiz.ids.filter(id => st.quiz.ans[id] !== 0), st.quiz.round + 1); save(); render(true); }
  else if (act === 'complete') { st.phase = 'done'; st.quiz = null; save(); render(true); }
  else if (act === 'again') { startQuiz(st.firstWrong.slice(), 1); save(); render(true); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-id]')) { st.open[d.dataset.id] = d.open; save(); } }, true);
$('#zytoggle').addEventListener('click', () => { st.zy = !st.zy; save(); renderSteps(); });

/* hold-to-confirm (2 s) */
let H = null;
function holdDone(act) {
  if (act === 'unlock') {
    if (st.sec < SECS.length - 1) { st.sec++; st.phase = 'review'; }
    else { st.firstWrong = Object.keys(st.marks).filter(k => st.marks[k] === 'W').sort((a, b) => { const [a1, a2] = a.split('-').map(Number), [b1, b2] = b.split('-').map(Number); return a1 - b1 || a2 - b2; });
      if (st.firstWrong.length) startQuiz(st.firstWrong.slice(), 1); else st.phase = 'done'; }
  } else if (act === 'reset') { const zy = st.zy; st = fresh(); st.zy = zy; }
  save(); render(true);
}
function holdStart(el) {
  holdStop(); const t0 = performance.now(); const label = el.querySelector('span'); const orig = label.textContent;
  H = { el, label, orig, raf: 0 };
  const tick = now => { const p = Math.min(1, (now - t0) / 2000); el.style.setProperty('--p', p);
    if (p >= 1) { const act = el.dataset.act; H = null; navigator.vibrate && navigator.vibrate(30); holdDone(act); return; }
    H.raf = requestAnimationFrame(tick); };
  label.textContent = '繼續按住…'; H.raf = requestAnimationFrame(tick);
}
function holdStop() { if (!H) return; cancelAnimationFrame(H.raf); H.el.style.setProperty('--p', 0); H.label.textContent = H.orig; H = null; }
document.addEventListener('pointerdown', e => { const el = e.target.closest('.hold'); if (!el) return; e.preventDefault(); holdStart(el); });
['pointerup', 'pointercancel'].forEach(t => window.addEventListener(t, holdStop));
document.addEventListener('pointerout', e => { if (H && e.target.closest('.hold') === H.el && !H.el.contains(e.relatedTarget)) holdStop(); });
document.addEventListener('contextmenu', e => { if (e.target.closest('.hold')) e.preventDefault(); });
document.addEventListener('keydown', e => { const el = e.target.closest && e.target.closest('.hold'); if (el && (e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); holdStart(el); } });
document.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') holdStop(); });

render();
</script>
